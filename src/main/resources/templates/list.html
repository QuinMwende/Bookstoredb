<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-0">
                    <i class="fas fa-boxes text-primary me-2"></i>
                    <span>Book Collection</span>
                </h1>
                <p class="text-muted mb-0" th:text="'Total: ' + ${totalBooks} + ' books'"></p>
            </div>
            <a th:href="@{/books/new}" class="btn btn-primary">
                <i class="fas fa-plus me-2"></i>Add New book
            </a>
        </div>

        <div th:if="${books.empty}">
            <div class="alert alert-info">
                <i class="fas fa-info-circle me-2"></i>
                No books found.
                <a th:href="@{/books/new}">Add your first book!</a>
            </div>
        </div>

        <div th:unless="${books.empty}" class="row">
            <div th:each="book : ${books}" class="col-md-6 col-lg-4 mb-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <h5 class="card-title text-primary" th:text="${book.title}"></h5>
                            <span class="badge bg-primary" th:text="${book.category}"></span>
                        </div>
                        <p class="card-text text-muted small">
                            <strong>Author:</strong> <span th:text="${book.author}"></span>
                        </p>
                        <div class="mb-3">
                            <span class="fw-bold">Price: </span>
                            <span class="text-success" th:text="'$' + ${#numbers.formatDecimal(book.price, 1, 2)}"></span>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-edit me-1"></i>Edit
                            </a>
                            <button class="btn btn-sm btn-outline-danger">
                                <i class="fas fa-trash me-1"></i>Delete
                            </button>
                        </div>
                    </div>
                    <div class="card-footer text-muted small">
                        Last updated: 
                        <span th:text="${book.updatedAt != null ? #temporals.format(book.updatedAt, 'dd/MM/yyyy HH:mm') : 'N/A'}"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mt-4" th:unless="${books.empty}">
            <div class="card-header bg-light">
                <h5 class="mb-0"><i class="fas fa-table me-2"></i>Book Details Table</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Title</th>
                                <th>Author</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>ISBN</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="book : ${books}">
                                <td th:text="${book.id}"></td>
                                <td th:text="${book.title}" class="fw-bold"></td>
                                <td th:text="${book.author}"></td>
                                <td>
                                    <span class="badge bg-info text-dark" th:text="${book.category}"></span>
                                </td>
                                <td class="text-success fw-bold" th:text="'$' + ${#numbers.formatDecimal(book.price, 1, 2)}"></td>
                                <td th:text="${book.isbn}"></td>
                                <td>
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-outline-primary">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <button class="btn btn-outline-danger">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
