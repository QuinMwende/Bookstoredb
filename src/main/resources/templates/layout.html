<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Product Management System</title>
 <!-- Bootstrap 5 CSS -->
 <link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">
 <!-- Font Awesome -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fontawesome/6.4.0/css/all.min.css">
 <style>
 body {
 background-color: #f8f9fa;
 }
 .navbar {
 background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
 }
 .card {
 border: none;
 border-radius: 10px;
 box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
 transition: transform 0.3s;
 }
 .card:hover {

 transform: translateY(-5px);
 }
 .btn-primary {
 background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
 border: none;
 }
 .btn-danger {
 background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
 border: none;
 }
 .table-hover tbody tr:hover {
 background-color: rgba(102, 126, 234, 0.1);
 }
 </style>
</head>
<body>
 <!-- Navigation Bar -->
 <nav class="navbar navbar-expand-lg navbar-dark">
 <div class="container">
 <a class="navbar-brand" th:href="@{/products}">
 <i class="fas fa-boxes me-2"></i>Product Management
 </a>
 <div class="collapse navbar-collapse">
 <ul class="navbar-nav me-auto">
 <li class="nav-item">
 <a class="nav-link" th:href="@{/products}">
 <i class="fas fa-list me-1"></i> All Products
 </a>
 </li>
 <li class="nav-item">
 <a class="nav-link" th:href="@{/products/new}">
 <i class="fas fa-plus-circle me-1"></i> Add Product
 </a>
 </li>
 </ul>
 <form class="d-flex" th:action="@{/products/search}" method="get">
 <input class="form-control me-2" type="search"
 name="keyword" placeholder="Search products..."
 aria-label="Search">
 <button class="btn btn-outline-light" type="submit">
 <i class="fas fa-search"></i>
 </button>
 </form>
 </div>
 </div>
 </nav>
 <!-- Main Content -->
 <div class="container mt-4">
 <!-- Success Messages -->
 <div th:if="${successMessage}" class="alert alert-success alertdismissible fade show">
 <span th:text="${successMessage}"></span>
 <button type="button" class="btn-close"
data-bs-dismiss="alert"></button>
 </div>
 <!-- Page Content -->
 <div th:replace="${content}"></div>
 </div>
 <!-- Bootstrap JS Bundle -->
15
 <script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
></script>
 <!-- Custom Scripts -->
 <script>
 // Auto-dismiss alerts after 5 seconds
 setTimeout(() => {
 const alerts = document.querySelectorAll('.alert');
 alerts.forEach(alert => {
 const bsAlert = new bootstrap.Alert(alert);
 bsAlert.close();
 });
 }, 5000);
 // Confirm delete
 function confirmDelete(id) {
 if (confirm('Are you sure you want to delete this product?')) {
 window.location.href = '/products/delete/' + id;
 }
 }
 </script>
</body>
</html>
