<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
 <div class="container mt-5">
 <div class="row justify-content-center">
 <div class="col-md-8 col-lg-6">
 <div class="card">
 <div class="card-header bg-warning text-dark">
 <h4 class="mb-0">
 <i class="fas fa-edit me-2"></i>Edit Book
 <small class="float-end">ID: <span th:text="${book.id}"></span></small>
 </h4>
 </div>
 <div class="card-body">
 <form th:action="@{/api/books/{id}(id=${book.id})}"
 th:object="${book}"
 method="post"
 id="editForm">
 
 <input type="hidden" th:field="*{id}">

 <div class="mb-3">
 <label for="title" class="form-label">Book Title *</label>
 <input type="text"
 class="form-control"
 id="title"
 th:field="*{title}"
 required>
 <div class="text-danger"
 th:if="${#fields.hasErrors('title')}"
 th:errors="*{title}"></div>
 </div>

 <div class="mb-3">
 <label class="form-label">Author *</label>
 <input type="text" th:field="*{author}" class="form-control" required>
 </div>

 <div class="mb-3">
 <label class="form-label">ISBN *</label>
 <input type="text" th:field="*{isbn}" class="form-control" required>
 </div>

 <div class="mb-3">
 <label for="category" class="form-label">Category *</label>
 <select class="form-select" id="category" th:field="*{category}" required>
 <option value="Programming">Programming</option>
 <option value="Fiction">Fiction</option>
 <option value="Science">Science</option>
 </select>
 </div>

 <div class="mb-3">
 <label class="form-label">Price ($) *</label>
 <input type="number" step="0.01" th:field="*{price}" class="form-control" required>
 </div>

 <div class="row text-muted small">
 <div class="col-md-6">
 <p>Created: <span th:text="${book.createdAt != null ? #temporals.format(book.createdAt, 'dd/MM/yyyy HH:mm:ss') : 'N/A'}"></span></p>
 </div>
 <div class="col-md-6">
 <p>Last Updated: <span th:text="${book.updatedAt != null ? #temporals.format(book.updatedAt, 'dd/MM/yyyy HH:mm:ss') : 'N/A'}"></span></p>
 </div>
 </div>

 <div class="d-flex justify-content-between mt-4">
 <a th:href="@{/}" class="btn btn-secondary">
 <i class="fas fa-times me-1"></i>Cancel
 </a>
 <div>
 <button type="submit" class="btn btn-warning">
 <i class="fas fa-save me-1"></i>Update Book
 </button>
 </div>
 </div>
 </form>
 </div>
 </div>
 </div>
 </div>
 </div>
</body>
</html>
