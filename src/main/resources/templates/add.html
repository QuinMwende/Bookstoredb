<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
 <div th:fragment="content">
 <div class="row justify-content-center">
 <div class="col-md-8 col-lg-6">
 <div class="card">
 <div class="card-header bg-primary text-white">
 <h4 class="mb-0">
 <i class="fas fa-plus-circle me-2"></i>Add New Book
 </h4>
 </div>
 <div class="card-body">
 <form th:action="@{/books/save}"
 th:object="${book}"
 method="post"
 id="bookForm">
 <!-- Title Field -->
 <div class="mb-3">
 <label for="name" class="form-label">
 <i class="fas fa-tag me-1"></i>Book Title *
 </label>
 <input type="text"
 class="form-control"
 id="title"
 th:field="*{title}"
 placeholder="Enter book title"
 required>
 <div class="text-danger"
 th:if="${#fields.hasErrors('title')}"
 th:errors="*{title}"></div>
 </div>
 <!-- Description Field -->
 <div class="mb-3">
 <label for="description" class="form-label"> <i
class="fas fa-align-left me-1"></i>Description * </label>
 </div>
 <!-- Price and Quantity Row -->
 <div class="row">
 <div class="col-md-6 mb-3">
 <label for="price" class="form-label">
 <i class="fas fa-dollar-sign
me-1"></i>Price *
 </label>
 <input type="number" class="form-control"
d="price" th:field="*{price}" step="0.01" min="0.01" placeholder="0.00" required>
 <div class="text-danger" th:if="$
{#fields.hasErrors('price')}" th:errors="*{price}"></div>
 </div>
 </div>
 <!-- Category Field -->
 <div class="mb-3">
 <label for="category" class="form-label">
 <i class="fas fa-folder me-1"></i>Category *
 </label>
11
 <select class="form-select"
 id="category"
 th:field="*{category}"
 required>
 <option value="" disabled selected>Select a
category</option>
 <option th:each="cat : ${categories}"
 th:value="${cat}"
 th:text="${cat}"></option>
 </select>
 <div class="text-danger"
 th:if="${#fields.hasErrors('category')}"
 th:errors="*{category}"></div>
 </div>
 <!-- Form Actions -->
 <div class="d-flex justify-content-between mt-4">
 <a th:href="@{/books}" class="btn btn-secondary">
 <i class="fas fa-arrow-left me-1"></i>Cancel
 </a>
 <button type="submit" class="btn btn-primary">
 <i class="fas fa-save me-1"></i>Save Book
 </button>
 </div>
 </form>
 </div>
 <div class="card-footer text-muted">
 <small>Fields marked with * are required</small>
 </div>
 </div>
 </div>
 </div>
 </div>
 <!-- Form Validation Script -->
 <script>
 document.getElementById('bookForm').addEventListener('submit', function(e)
{
 const price = document.getElementById('price').value;
 const quantity = document.getElementById('quantity').value;
 if (price <= 0) {
 alert('Price must be greater than 0');
 e.preventDefault();
 return false;
 }
 if (quantity < 0) {
 alert('Quantity cannot be negative');
 e.preventDefault();
 return false;
 }
 return true;
 });
 </script>
</body>
</html>
