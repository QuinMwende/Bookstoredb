<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">
 <div class="container mt-5">
 <div class="row justify-content-center">
 <div class="col-md-8 col-lg-6">
 <div class="card shadow">
 <div class="card-header bg-primary text-white">
 <h4 class="mb-0">
 <i class="fas fa-plus-circle me-2"></i>Add New Book
 </h4>
 </div>
 <div class="card-body">
 <form th:action="@{/api/books}"
 th:object="${book}"
 method="post"
 id="bookForm">
 
 <div class="mb-3">
 <label class="form-label">
 <i class="fas fa-tag me-1"></i>Book Title *
 </label>
 <input type="text"
 class="form-control"
 th:field="*{title}"
 placeholder="Enter book title"
 required>
 <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
 </div>

 <div class="mb-3">
 <label class="form-label">
 <i class="fas fa-user me-1"></i>Author *
 </label>
 <input type="text"
 class="form-control"
 th:field="*{author}"
 placeholder="Enter author name"
 required>
 <div class="text-danger" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></div>
 </div>

 <div class="mb-3">
 <label class="form-label">
 <i class="fas fa-barcode me-1"></i>ISBN *
 </label>
 <input type="text"
 class="form-control"
 th:field="*{isbn}"
 placeholder="Enter ISBN"
 required>
 </div>

 <div class="row">
 <div class="col-md-6 mb-3">
 <label class="form-label">
 <i class="fas fa-dollar-sign me-1"></i>Price *
 </label>
 <input type="number" class="form-control"
 id="price" th:field="*{price}" step="0.01" min="0.01" placeholder="0.00" required>
 <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
 </div>
 </div>

 <div class="mb-3">
 <label class="form-label">
 <i class="fas fa-folder me-1"></i>Category *
 </label>
 <select class="form-select" th:field="*{category}" required>
 <option value="" disabled selected>Select a category</option>
 <option value="Programming">Programming</option>
 <option value="Fiction">Fiction</option>
 <option value="Science">Science</option>
 </select>
 </div>

 <div class="d-flex justify-content-between mt-4">
 <a th:href="@{/}" class="btn btn-secondary">
 <i class="fas fa-arrow-left me-1"></i>Cancel
 </a>
 <button type="submit" class="btn btn-primary">
 <i class="fas fa-save me-1"></i>Save Book
 </button>
 </div>
 </form>
 </div>
 <div class="card-footer text-muted">
 <small>Fields marked with * are required</small>
 </div>
 </div>
 </div>
 </div>
 </div>

 <script>
 document.getElementById('bookForm').addEventListener('submit', function(e) {
 const price = document.getElementById('price').value;
 if (price <= 0) {
 alert('Price must be greater than 0');
 e.preventDefault();
 return false;
 }
 return true;
 });
 </script>
</body>
</html>
